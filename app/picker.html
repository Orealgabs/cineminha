<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Escolha o que transmitir</title>
<style>
:root{--bg:#121014;--panel:#1d1a21;--line:#2c2731;--fg:#f5f0ea;--muted:#aba2ac;--accent:#ff9b74;--accent-ink:#2b1209;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:18px 20px 10px}
h1{font:700 22px Georgia,serif;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:6px;padding:0 20px 12px}
.tabs button{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:600 13px "Segoe UI",system-ui,sans-serif;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{flex:1;overflow:auto;padding:4px 20px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.src{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--fg);font:inherit;min-width:0}
.src:hover{border-color:#3a3340}
.src[aria-pressed="true"]{border-color:var(--accent)}
.src:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thumb{aspect-ratio:16/9;width:100%;background:#000;border-radius:6px;object-fit:contain;display:block}
.name{display:flex;gap:6px;align-items:center;min-width:0}
.name img{width:16px;height:16px;flex:none}
.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);padding:24px 0}
footer{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.note{color:var(--muted);font-size:12.5px;margin-right:auto;flex:1 1 260px}
footer button{border-radius:10px;padding:10px 18px;font:600 14px "Segoe UI",system-ui,sans-serif;cursor:pointer}
#cancel{background:none;color:var(--fg);border:1px solid var(--line)}
#ok{background:var(--accent);color:var(--accent-ink);border:0}
#ok:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<header>
  <h1>Escolha o que transmitir</h1>
  <div class="sub">Para série em tela cheia, escolha a janela do navegador onde ela está tocando.</div>
</header>
<div class="tabs" role="tablist">
  <button id="tWin" role="tab" aria-selected="true">Janelas</button>
  <button id="tScr" role="tab" aria-selected="false">Tela inteira</button>
</div>
<main><div class="grid" id="grid"></div></main>
<footer>
  <div class="note" id="note"></div>
  <button id="cancel" type="button">Cancelar</button>
  <button id="ok" type="button" disabled>Transmitir</button>
</footer>
<script>
  let sources = [], showScreens = false, chosen = null;
  const grid = document.getElementById("grid"), ok = document.getElementById("ok");
  function render(){
    grid.innerHTML = "";
    const list = sources.filter(s => s.screen === showScreens);
    if (!list.length) { const d = document.createElement("div"); d.className = "empty"; d.textContent = showScreens ? "Nenhuma tela encontrada." : "Nenhuma janela aberta. Abra o jogo ou o navegador e tente de novo."; grid.appendChild(d); }
    list.forEach((s, i) => {
      const b = document.createElement("button");
      b.className = "src"; b.type = "button"; b.setAttribute("aria-pressed", s.id === chosen);
      const t = document.createElement("img"); t.className = "thumb"; t.alt = ""; if (s.thumb) t.src = s.thumb;
      const n = document.createElement("div"); n.className = "name";
      if (s.icon) { const ic = document.createElement("img"); ic.src = s.icon; ic.alt = ""; n.appendChild(ic); }
      const sp = document.createElement("span"); sp.textContent = s.screen ? (list.length > 1 ? "Tela " + (i + 1) : "Tela inteira") : s.name; sp.title = s.name; n.appendChild(sp);
      b.append(t, n);
      b.onclick = () => { chosen = s.id; ok.disabled = false; render(); };
      b.ondblclick = () => window.picker.choose(s.id);
      grid.appendChild(b);
    });
  }
  function tab(screens){
    showScreens = screens;
    document.getElementById("tWin").setAttribute("aria-selected", !screens);
    document.getElementById("tScr").setAttribute("aria-selected", screens);
    render();
  }
  document.getElementById("tWin").onclick = () => tab(false);
  document.getElementById("tScr").onclick = () => tab(true);
  document.getElementById("cancel").onclick = () => window.picker.choose(null);
  ok.onclick = () => chosen && window.picker.choose(chosen);
  document.addEventListener("keydown", e => { if (e.key === "Escape") window.picker.choose(null); });
  window.picker.onSources(({ sources: s, withAudio }) => {
    sources = s;
    document.getElementById("note").textContent = withAudio
      ? "O som enviado é o do PC inteiro (inclui o Discord). Para só o jogo, use \"Som de um programa\"."
      : "";
    tab(!s.some(x => !x.screen));
  });
</script>
</body>
</html>
