name: Diagnóstico da sala
on: workflow_dispatch
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8000 >/dev/null 2>&1 &) && sleep 1 && node .github/diag/e2e.cjs
